<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🎉 Chúc Mừng Sinh Nhật - 3D Waterfall 🎂</title>
  <meta name="description" content="Không gian 3D chúc mừng sinh nhật tuyệt đẹp: 50 lời chúc rực rỡ, gấu bông, bó hoa, hộp quà và bánh kem rơi tự do.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;800;900&family=Mali:wght@700&display=swap" rel="stylesheet">
  <!-- Three.js & Controls & Confetti -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #090312;
      color: #fff;
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Ambient Dynamic Glow */
    .bg-gradient {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 30%, #250a3d 0%, #11041f 55%, #05010a 100%);
      z-index: 0;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.42;
      pointer-events: none;
      z-index: 0;
      animation: floatOrb 10s infinite alternate ease-in-out;
    }
    .orb-1 { width: 380px; height: 380px; background: #ff416c; top: 5%; left: 5%; }
    .orb-2 { width: 340px; height: 340px; background: #ffd166; bottom: 15%; right: 10%; animation-delay: -3s; }
    .orb-3 { width: 300px; height: 300px; background: #b224ef; top: 40%; right: 30%; animation-delay: -6s; }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(35px, 50px) scale(1.18); }
    }

    /* Floating Tiny Audio Toggle (Góc trên cùng bên phải, cực kỳ tinh tế) */
    .audio-btn-corner {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 50;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.15rem;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      transition: all 0.25s ease;
    }

    .audio-btn-corner:hover {
      transform: scale(1.1);
      background: rgba(255, 255, 255, 0.25);
    }

    .music-pulse {
      animation: musicPulse 1.4s infinite;
    }

    @keyframes musicPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 117, 140, 0.7); }
      50% { box-shadow: 0 0 0 10px rgba(255, 117, 140, 0); }
    }
  </style>
</head>
<body>

  <!-- Audio Element -->
  <audio id="bg-music" src="happy-birthday.mp3" loop preload="auto"></audio>

  <!-- Background Lights -->
  <div class="bg-gradient"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <!-- 3D Canvas -->
  <div id="canvas-container"></div>

  <!-- Tiny Audio Control -->
  <button class="audio-btn-corner music-pulse" id="audio-btn" title="Bật/Tắt nhạc">🎵</button>

  <script>
    /* =========================================================================
       1. 50 LỜI CHÚC SINH NHẬT CHỌN LỌC & 15 BẢNG MÀU GRADIENT ĐẸP NHẤT
       ========================================================================= */
    const PALETTES = [
      ["#ff416c", "#ff4b2b"], // Đỏ cam tiệc tùng
      ["#f7971e", "#ffd200"], // Vàng hoàng kim
      ["#ff758c", "#ff7eb3"], // Hồng phấn ngọt ngào
      ["#b224ef", "#7579ff"], // Tím neon huyền bí
      ["#11998e", "#38ef7d"], // Xanh ngọc may mắn
      ["#00c6ff", "#0072ff"], // Xanh biển hy vọng
      ["#8a2387", "#e94057"], // Tím đỏ hoàng hôn
      ["#f12711", "#f5af19"], // Cam hổ phách
      ["#654ea3", "#eaafc8"], // Tím lilac mộng mơ
      ["#4facfe", "#00f2fe"], // Xanh mint băng tuyết
      ["#fa709a", "#fee140"], // Hồng đào nắng sớm
      ["#0ba360", "#3cba92"], // Xanh lục tài lộc
      ["#f857a6", "#ff5858"], // Đỏ cherry ngọt ngào
      ["#36d1dc", "#5b86e5"], // Lam ngọc bích
      ["#e52d27", "#b31217"]  // Đỏ nhung quyền lực
    ];

    const WISH_TEXTS_50 = [
      "🎂 HAPPY BIRTHDAY 🎂",
      "Chúc Mừng Sinh Nhật Sếp! 👑",
      "Tuổi Mới Rực Rỡ & Thăng Hoa ✨",
      "Tiền Vào Như Nước Sông Đà 💰",
      "Tiền Ra Nhỏ Giọt Cà Phê Phin ☕",
      "Thành Công Bứt Phá Mọi Giới Hạn 🚀",
      "Vạn Sự Như Ý - Tỷ Sự Như Mơ 🍀",
      "Công Việc Thuận Buồm Xuôi Gió ⛵",
      "Ký Hợp Đồng Mỏi Tay 📝",
      "Doanh Thu Đột Phá X10 📈",
      "Sếp Mãi Đỉnh - Đỉnh Của Chóp 🏔️",
      "Sự Nghiệp Lên Như Diều Gặp Gió 🪁",
      "Một Năm Đầy Ắp Cơ Hội Vàng 🏆",
      "Bản Lĩnh Vững Vàng Trước Sóng Gió 🌊",
      "Tài Lộc Dồi Dào Quanh Năm 💎",
      "Sức Khỏe Vô Biên - Tinh Thần Thép 💪",
      "Trẻ Khỏe Năng Động Mỗi Ngày 🏃‍♂️",
      "Nụ Cười Luôn Nở Trên Môi 😄",
      "Tràn Đầy Năng Lượng Tích Cực ⚡",
      "Trẻ Mãi Không Già - Đẹp Trai Bất Chấp 😎",
      "Tâm Hồn Luôn Thanh Thản An Nhiên 🍃",
      "Bình An Trong Từng Giây Phút 🕊️",
      "Cuộc Sống An Lạc & Hạnh Phúc 🌸",
      "Trái Tim Luôn Tràn Ngập Tình Yêu ❤️",
      "Gia Đình Ấm Êm Hạnh Phúc Viên Mãn 👨‍👩‍👧‍👦",
      "Tình Yêu Thăng Hoa Ngọt Ngào 💖",
      "Đi Đâu Cũng Gặp Quý Nhân 🌟",
      "Ước Gì Được Nấy - Cầu Được Ước Thấy 🎁",
      "Shopping Không Cần Nhìn Giá 🛍️",
      "Du Lịch Khắp Năm Châu Bốn Bể ✈️",
      "Ăn Chơi Hết Mình - Làm Hết Sức 🥂",
      "Xe Sang - Nhà Đẹp - Đời Nở Hoa 🚗",
      "Phong Độ Là Nhất Thời - Đẳng Cấp Là Mãi Mãi 👑",
      "Ví Luôn Dày Cộm Tiền Mặt & Thẻ 💳",
      "Số Đỏ Quanh Năm - Vận May Gõ Cửa 🎰",
      "Tự Do Tài Chính - Thảnh Thơi Hưởng Thụ 🍹",
      "Mỗi Ngày Là Một Bữa Tiệc Rực Rỡ 🎉",
      "Tuổi Mới Bớt Cọc - Thêm Giàu 😆",
      "Deadline Tự Biến Mất - Task Tự Xong 🪄",
      "Tài Khoản Ting Ting Liên Hồi 📲",
      "Luôn Là Ngôi Sao Sáng Nhất Buổi Tiệc 🌠",
      "Ngồi Không Tiền Cũng Rơi Trúng Đầu 💸",
      "Tỏa Sáng Rực Rỡ Theo Phong Cách Riêng 💫",
      "Vượt Qua Mọi Thách Thức Thần Kỳ ⚡",
      "Đón Nhận Cơn Mưa Tài Lộc & May Mắn 🌧️",
      "Hôm Nay Bạn Là Nhân Vật Chính 🎉",
      "Mọi Ước Nguyện Đều Thành Hiện Thực 🕯️",
      "Happy Birthday To An Amazing Soul 🎂",
      "Tuổi Mới - Vận Hội Mới - Thắng Lợi Mới 🏆",
      "Happy Birthday - Vạn Dặm Bình An! 🌈"
    ];

    const ALL_50_WISHES = WISH_TEXTS_50.map((text, idx) => ({
      id: idx + 1,
      text: text,
      bg: PALETTES[idx % PALETTES.length]
    }));

    /* =========================================================================
       2. AUDIO CONTROLLER
       ========================================================================= */
    const bgMusic = document.getElementById('bg-music');
    const audioBtn = document.getElementById('audio-btn');
    let isMusicPlaying = false;
    let audioCtx = null;

    function initAudioContext() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playPopSound() {
      try {
        if (!audioCtx) initAudioContext();
        if (!audioCtx || audioCtx.state === 'suspended') return;
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'sine';
        const now = audioCtx.currentTime;
        osc.frequency.setValueAtTime(560, now);
        osc.frequency.exponentialRampToValueAtTime(220, now + 0.08);
        g.gain.setValueAtTime(0.09, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.08);
      } catch (e) {}
    }

    function tryPlayMusic() {
      initAudioContext();
      bgMusic.volume = 0.85;
      const playPromise = bgMusic.play();
      if (playPromise !== undefined) {
        playPromise.then(() => {
          isMusicPlaying = true;
          audioBtn.textContent = '🔊';
          audioBtn.classList.remove('music-pulse');
        }).catch(() => {
          isMusicPlaying = false;
          audioBtn.textContent = '🎵';
          audioBtn.classList.add('music-pulse');
        });
      }
    }

    function unlockAudioOnGesture() {
      if (!isMusicPlaying) {
        tryPlayMusic();
      }
      window.removeEventListener('pointerdown', unlockAudioOnGesture);
      window.removeEventListener('touchstart', unlockAudioOnGesture);
      window.removeEventListener('click', unlockAudioOnGesture);
    }
    window.addEventListener('pointerdown', unlockAudioOnGesture, { passive: true });
    window.addEventListener('touchstart', unlockAudioOnGesture, { passive: true });
    window.addEventListener('click', unlockAudioOnGesture, { passive: true });

    audioBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      initAudioContext();
      if (bgMusic.paused) {
        bgMusic.play();
        isMusicPlaying = true;
        audioBtn.textContent = '🔊';
        audioBtn.classList.remove('music-pulse');
      } else {
        bgMusic.pause();
        isMusicPlaying = false;
        audioBtn.textContent = '🔇';
      }
    });

    /* =========================================================================
       3. THREE.JS SCENE, CAMERA, LIGHTS & ORBIT CONTROLS
       ========================================================================= */
    const container = document.getElementById('canvas-container');
    let width = window.innerWidth;
    let height = window.innerHeight;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 200);
    camera.position.set(0, 0, 34);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enablePan = false;
    controls.minDistance = 14;
    controls.maxDistance = 50;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.38;

    // Studio Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.95);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.4);
    dirLight.position.set(10, 25, 20);
    scene.add(dirLight);

    const pointLight1 = new THREE.PointLight(0xff758c, 2.0, 50);
    pointLight1.position.set(-16, 12, 16);
    scene.add(pointLight1);

    const pointLight2 = new THREE.PointLight(0xffd166, 2.0, 50);
    pointLight2.position.set(16, -12, 16);
    scene.add(pointLight2);

    /* =========================================================================
       4. FAIRY DUST PARTICLES
       ========================================================================= */
    const particleCount = 220;
    const particleGeo = new THREE.BufferGeometry();
    const particlePos = new Float32Array(particleCount * 3);
    const particleColors = new Float32Array(particleCount * 3);

    for (let i = 0; i < particleCount; i++) {
      particlePos[i * 3] = (Math.random() - 0.5) * 55;
      particlePos[i * 3 + 1] = (Math.random() - 0.5) * 70;
      particlePos[i * 3 + 2] = (Math.random() - 0.5) * 40;

      if (Math.random() > 0.5) {
        particleColors[i * 3] = 1.0; particleColors[i * 3 + 1] = 0.82; particleColors[i * 3 + 2] = 0.4;
      } else {
        particleColors[i * 3] = 1.0; particleColors[i * 3 + 1] = 0.46; particleColors[i * 3 + 2] = 0.6;
      }
    }

    particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
    particleGeo.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));

    const particleMat = new THREE.PointsMaterial({
      size: 0.65,
      vertexColors: true,
      transparent: true,
      opacity: 0.85
    });

    const particles = new THREE.Points(particleGeo, particleMat);
    scene.add(particles);

    /* =========================================================================
       5. 3D MODELS: GẤU BÔNG 🧸, BÓ HOA 💐, BÁNH KEM 🎂, HỘP QUÀ 🎁, TRÁI TIM ❤️
       ========================================================================= */
    const textureCache = new Map();

    // High-res Sprite Text Badge (Chuẩn V5: Rõ nét, đẹp, bo tròn bóng bẩy)
    function getPillTexture(wish) {
      if (textureCache.has(wish.text)) {
        return textureCache.get(wish.text);
      }

      const canvas = document.createElement('canvas');
      canvas.width = 800;
      canvas.height = 200;
      const ctx = canvas.getContext('2d');
      const w = 800;
      const h = 200;
      const r = 90;

      // Glow viền
      ctx.shadowColor = wish.bg[0];
      ctx.shadowBlur = 24;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 4;

      // Gradient nền
      const grad = ctx.createLinearGradient(30, 20, w - 30, h - 20);
      grad.addColorStop(0, wish.bg[0]);
      grad.addColorStop(1, wish.bg[1]);

      ctx.beginPath();
      ctx.moveTo(30 + r, 20);
      ctx.lineTo(w - 30 - r, 20);
      ctx.arcTo(w - 30, 20, w - 30, h - 20, r);
      ctx.lineTo(w - 30, h - 20 - r);
      ctx.arcTo(w - 30, h - 20, 30, h - 20, r);
      ctx.lineTo(30 + r, h - 20);
      ctx.arcTo(30, h - 20, 30, 20, r);
      ctx.lineTo(30, 20 + r);
      ctx.arcTo(30, 20, w - 30, 20, r);
      ctx.closePath();

      ctx.fillStyle = grad;
      ctx.fill();

      // Viền nổi 3D
      ctx.shadowBlur = 0;
      ctx.lineWidth = 8;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
      ctx.stroke();

      // Top Glass
      ctx.save();
      ctx.clip();
      const gloss = ctx.createLinearGradient(0, 20, 0, h * 0.5);
      gloss.addColorStop(0, 'rgba(255, 255, 255, 0.55)');
      gloss.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = gloss;
      ctx.fillRect(30, 20, w - 60, h * 0.5);
      ctx.restore();

      // Text to rõ nét
      const len = wish.text.length;
      let fontSize = 44;
      if (len > 34) fontSize = 33;
      else if (len > 24) fontSize = 38;

      ctx.font = `900 ${fontSize}px "Be Vietnam Pro", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      ctx.shadowColor = 'rgba(0, 0, 0, 0.7)';
      ctx.shadowBlur = 12;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 4;

      ctx.fillStyle = '#ffffff';
      ctx.fillText(wish.text, w / 2, h / 2);

      const texture = new THREE.CanvasTexture(canvas);
      texture.generateMipmaps = true;
      texture.minFilter = THREE.LinearMipmapLinearFilter;
      textureCache.set(wish.text, texture);
      return texture;
    }

    const fallingItems = [];

    // 1. Sprite Pill Wish
    function createPillSprite(wish, startX, startY, startZ, speed) {
      const texture = getPillTexture(wish);
      const spriteMat = new THREE.SpriteMaterial({
        map: texture,
        transparent: true,
        depthWrite: false
      });

      const sprite = new THREE.Sprite(spriteMat);
      const isMobile = window.innerWidth < 600;
      const baseWidth = isMobile ? 8.2 : 9.6;
      const baseHeight = baseWidth / 4.0;
      sprite.scale.set(baseWidth, baseHeight, 1);
      sprite.position.set(startX, startY, startZ);

      scene.add(sprite);

      const item = {
        mesh: sprite,
        wish,
        baseSpeed: speed,
        initialY: 34,
        resetY: -32,
        type: 'pill'
      };
      fallingItems.push(item);
      return item;
    }

    // 2. GẤU BÔNG 3D DỄ THƯƠNG 🧸
    function createTeddyBear(startX, startY, startZ, speed) {
      const group = new THREE.Group();

      const furMat = new THREE.MeshStandardMaterial({ color: 0xc68b59, roughness: 0.65 });
      const muzzleMat = new THREE.MeshStandardMaterial({ color: 0xf3d2b5, roughness: 0.6 });
      const eyeMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1 });
      const ribbonMat = new THREE.MeshStandardMaterial({ color: 0xff3366, roughness: 0.3 });

      // Body
      const body = new THREE.Mesh(new THREE.SphereGeometry(0.9, 16, 16), furMat);
      body.scale.set(1, 1.2, 0.9);
      group.add(body);

      // Head
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.75, 16, 16), furMat);
      head.position.set(0, 1.3, 0.1);
      group.add(head);

      // Snout
      const snout = new THREE.Mesh(new THREE.SphereGeometry(0.3, 14, 14), muzzleMat);
      snout.position.set(0, 1.2, 0.7);
      snout.scale.set(1.1, 0.85, 0.9);
      group.add(snout);

      // Nose
      const nose = new THREE.Mesh(new THREE.SphereGeometry(0.09, 10, 10), eyeMat);
      nose.position.set(0, 1.32, 0.96);
      group.add(nose);

      // Eyes
      const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.08, 10, 10), eyeMat);
      eyeL.position.set(-0.25, 1.45, 0.68);
      const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.08, 10, 10), eyeMat);
      eyeR.position.set(0.25, 1.45, 0.68);
      group.add(eyeL);
      group.add(eyeR);

      // Ears
      const earL = new THREE.Mesh(new THREE.SphereGeometry(0.26, 12, 12), furMat);
      earL.position.set(-0.55, 1.9, 0);
      const earR = new THREE.Mesh(new THREE.SphereGeometry(0.26, 12, 12), furMat);
      earR.position.set(0.55, 1.9, 0);
      group.add(earL);
      group.add(earR);

      // Ribbon Bow
      const bow = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.22, 0.2), ribbonMat);
      bow.position.set(0, 0.8, 0.7);
      group.add(bow);

      // Arms & Legs
      const armL = new THREE.Mesh(new THREE.SphereGeometry(0.32, 12, 12), furMat);
      armL.position.set(-0.95, 0.4, 0.2);
      armL.scale.set(0.8, 1.3, 0.8);
      const armR = new THREE.Mesh(new THREE.SphereGeometry(0.32, 12, 12), furMat);
      armR.position.set(0.95, 0.4, 0.2);
      armR.scale.set(0.8, 1.3, 0.8);
      group.add(armL);
      group.add(armR);

      const legL = new THREE.Mesh(new THREE.SphereGeometry(0.36, 12, 12), furMat);
      legL.position.set(-0.55, -0.85, 0.3);
      const legR = new THREE.Mesh(new THREE.SphereGeometry(0.36, 12, 12), furMat);
      legR.position.set(0.55, -0.85, 0.3);
      group.add(legL);
      group.add(legR);

      group.position.set(startX, startY, startZ);
      scene.add(group);

      const item = {
        mesh: group,
        baseSpeed: speed,
        rotSpeedX: (Math.random() - 0.5) * 0.02,
        rotSpeedY: 0.02,
        rotSpeedZ: (Math.random() - 0.5) * 0.015,
        initialY: 34,
        resetY: -32,
        type: 'bear'
      };
      fallingItems.push(item);
      return item;
    }

    // 3. BÓ HOA TƯƠI RỰC RỠ 💐
    function createFlowerBouquet(startX, startY, startZ, speed) {
      const group = new THREE.Group();

      // Cone wrapper (giấy gói hoa)
      const wrapGeo = new THREE.ConeGeometry(1.1, 2.2, 16, 1, true);
      const wrapMat = new THREE.MeshStandardMaterial({ color: 0xf5b5c5, roughness: 0.4, side: THREE.DoubleSide });
      const wrapMesh = new THREE.Mesh(wrapGeo, wrapMat);
      wrapMesh.rotation.x = Math.PI; // Úp nón xuống
      wrapMesh.position.y = -0.5;
      group.add(wrapMesh);

      // Cụm hoa nhiều màu
      const flowerColors = [0xff3366, 0xffd700, 0xff6699, 0xffffff, 0xff5722, 0xe040fb];
      for (let i = 0; i < 7; i++) {
        const fCol = flowerColors[i % flowerColors.length];
        const fMat = new THREE.MeshStandardMaterial({ color: fCol, roughness: 0.3 });
        const fMesh = new THREE.Mesh(new THREE.SphereGeometry(0.36, 12, 12), fMat);

        const angle = (i / 6) * Math.PI * 2;
        const rad = i === 0 ? 0 : 0.6;
        fMesh.position.set(Math.cos(angle) * rad, 0.6 + (i === 0 ? 0.25 : 0), Math.sin(angle) * rad);
        group.add(fMesh);
      }

      // Vài lá xanh
      const leafMat = new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness: 0.4 });
      for (let j = 0; j < 3; j++) {
        const leaf = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.6, 6), leafMat);
        const lAngle = (j / 3) * Math.PI * 2 + 0.5;
        leaf.position.set(Math.cos(lAngle) * 0.9, 0.4, Math.sin(lAngle) * 0.9);
        leaf.rotation.z = Math.cos(lAngle) * 0.5;
        group.add(leaf);
      }

      group.position.set(startX, startY, startZ);
      scene.add(group);

      const item = {
        mesh: group,
        baseSpeed: speed,
        rotSpeedX: (Math.random() - 0.5) * 0.02,
        rotSpeedY: 0.025,
        rotSpeedZ: (Math.random() - 0.5) * 0.02,
        initialY: 34,
        resetY: -32,
        type: 'bouquet'
      };
      fallingItems.push(item);
      return item;
    }

    // 4. HỘP QUÀ VUÔNG BUỘC NƠ 🎁
    function createGiftMesh(startX, startY, startZ, speed) {
      const size = 1.7;
      const geometry = new THREE.BoxGeometry(size, size, size);
      const colors = [0xff416c, 0xb224ef, 0x11998e, 0xf7971e, 0xff758c, 0x00c6ff];
      const boxColor = colors[Math.floor(Math.random() * colors.length)];

      const boxMat = new THREE.MeshStandardMaterial({ color: boxColor, roughness: 0.25, metalness: 0.1 });
      const ribbonMat = new THREE.MeshStandardMaterial({ color: 0xffd166, roughness: 0.2, metalness: 0.4 });

      const mesh = new THREE.Mesh(geometry, boxMat);
      const rH = new THREE.Mesh(new THREE.BoxGeometry(size + 0.05, 0.35, size + 0.05), ribbonMat);
      const rV = new THREE.Mesh(new THREE.BoxGeometry(0.35, size + 0.05, size + 0.05), ribbonMat);
      mesh.add(rH);
      mesh.add(rV);

      mesh.position.set(startX, startY, startZ);
      scene.add(mesh);

      const item = {
        mesh,
        baseSpeed: speed,
        rotSpeedX: (Math.random() - 0.5) * 0.03,
        rotSpeedY: (Math.random() - 0.5) * 0.03,
        rotSpeedZ: (Math.random() - 0.5) * 0.03,
        initialY: 34,
        resetY: -32,
        type: 'gift'
      };
      fallingItems.push(item);
      return item;
    }

    // 5. BÁNH KEM SINH NHẬT CẮM NẾN 🎂
    function createCakeMesh(startX, startY, startZ, speed) {
      const group = new THREE.Group();

      const bGeo = new THREE.CylinderGeometry(1.3, 1.3, 0.75, 24);
      const bMat = new THREE.MeshStandardMaterial({ color: 0xffe3e3, roughness: 0.3 });
      const bMesh = new THREE.Mesh(bGeo, bMat);
      bMesh.position.y = -0.38;
      group.add(bMesh);

      const tGeo = new THREE.CylinderGeometry(0.9, 0.9, 0.65, 24);
      const tMat = new THREE.MeshStandardMaterial({ color: 0xff758c, roughness: 0.3 });
      const tMesh = new THREE.Mesh(tGeo, tMat);
      tMesh.position.y = 0.32;
      group.add(tMesh);

      const cGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.55, 12);
      const cMat = new THREE.MeshStandardMaterial({ color: 0xffd166, roughness: 0.2 });
      const cMesh = new THREE.Mesh(cGeo, cMat);
      cMesh.position.y = 0.9;
      group.add(cMesh);

      const fGeo = new THREE.SphereGeometry(0.14, 12, 12);
      const fMat = new THREE.MeshBasicMaterial({ color: 0xff4b2b });
      const fMesh = new THREE.Mesh(fGeo, fMat);
      fMesh.position.y = 1.25;
      group.add(fMesh);

      group.position.set(startX, startY, startZ);
      scene.add(group);

      const item = {
        mesh: group,
        baseSpeed: speed,
        rotSpeedX: 0,
        rotSpeedY: 0.018,
        rotSpeedZ: 0,
        initialY: 34,
        resetY: -32,
        type: 'cake'
      };
      fallingItems.push(item);
      return item;
    }

    // 6. TRÁI TIM 3D ĐỎ HỒNG ❤️
    function createHeartMesh(startX, startY, startZ, speed) {
      const shape = new THREE.Shape();
      const x = 0, y = 0;
      shape.moveTo(x + 0.25, y + 0.25);
      shape.bezierCurveTo(x + 0.25, y + 0.25, x + 0.2, y, x, y);
      shape.bezierCurveTo(x - 0.3, y, x - 0.3, y + 0.35, x - 0.3, y + 0.35);
      shape.bezierCurveTo(x - 0.3, y + 0.55, x - 0.1, y + 0.77, x + 0.25, y + 1.0);
      shape.bezierCurveTo(x + 0.6, y + 0.77, x + 0.8, y + 0.55, x + 0.8, y + 0.35);
      shape.bezierCurveTo(x + 0.8, y + 0.35, x + 0.8, y, x + 0.5, y);
      shape.bezierCurveTo(x + 0.35, y, x + 0.25, y + 0.25, x + 0.25, y + 0.25);

      const extrudeSettings = { depth: 0.35, bevelEnabled: true, bevelSegments: 3, steps: 1, bevelSize: 0.1, bevelThickness: 0.1 };
      const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
      geo.center();

      const mat = new THREE.MeshStandardMaterial({ color: 0xff1744, roughness: 0.2, metalness: 0.1 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.rotation.z = Math.PI;
      mesh.scale.set(1.4, 1.4, 1.4);
      mesh.position.set(startX, startY, startZ);
      scene.add(mesh);

      const item = {
        mesh,
        baseSpeed: speed,
        rotSpeedX: (Math.random() - 0.5) * 0.03,
        rotSpeedY: 0.025,
        rotSpeedZ: (Math.random() - 0.5) * 0.02,
        initialY: 34,
        resetY: -32,
        type: 'heart'
      };
      fallingItems.push(item);
      return item;
    }

    /* =========================================================================
       6. KHỞI TẠO CƠN MƯA 50 LỜI CHÚC & QUÀ CÁP ĐA DẠNG
       ========================================================================= */
    let nextWishIndex = 0;

    function getNextWish() {
      const wish = ALL_50_WISHES[nextWishIndex % ALL_50_WISHES.length];
      nextWishIndex++;
      return wish;
    }

    function initThickWaterfall() {
      const isMobile = window.innerWidth < 600;
      const spreadX = isMobile ? 12 : 24;
      const spreadZ = isMobile ? 12 : 20;

      // 1. Tạo 40 thẻ lời chúc rơi liên tục
      const wishCount = 40;
      for (let i = 0; i < wishCount; i++) {
        const wish = getNextWish();
        const x = (Math.random() - 0.5) * spreadX;
        const y = -28 + (i / wishCount) * 62;
        const z = (Math.random() - 0.5) * spreadZ;
        const speed = 0.06 + Math.random() * 0.06;
        createPillSprite(wish, x, y, z, speed);
      }

      // 2. Tạo 16 vật thể quà cáp đa dạng rơi xen kẽ (Gấu bông, Bó hoa, Bánh kem, Hộp quà, Trái tim)
      for (let j = 0; j < 16; j++) {
        const x = (Math.random() - 0.5) * spreadX;
        const y = -26 + (j / 16) * 60;
        const z = (Math.random() - 0.5) * spreadZ;
        const speed = 0.05 + Math.random() * 0.05;

        const type = j % 5;
        if (type === 0) createTeddyBear(x, y, z, speed);
        else if (type === 1) createFlowerBouquet(x, y, z, speed);
        else if (type === 2) createCakeMesh(x, y, z, speed);
        else if (type === 3) createGiftMesh(x, y, z, speed);
        else if (type === 4) createHeartMesh(x, y, z, speed);
      }
    }
    initThickWaterfall();

    /* =========================================================================
       7. CLICK / TOUCH INTERACTION & CONFETTI
       ========================================================================= */
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    function triggerConfettiAt(x, y) {
      confetti({
        particleCount: 28,
        spread: 60,
        origin: { x: x / window.innerWidth, y: y / window.innerHeight }
      });
    }

    function onPointerDown(e) {
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      mouse.x = (clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const meshes = fallingItems.map(item => item.mesh);
      const intersects = raycaster.intersectObjects(meshes, true);

      if (intersects.length > 0) {
        let hitObj = intersects[0].object;
        while (hitObj.parent && hitObj.parent !== scene) {
          hitObj = hitObj.parent;
        }

        const found = fallingItems.find(item => item.mesh === hitObj);
        if (found) {
          found.mesh.position.y += 3.0;
          if (found.rotSpeedY !== undefined) found.rotSpeedY += 0.2;
          playPopSound();
          triggerConfettiAt(clientX, clientY);
        }
      }
    }
    window.addEventListener('pointerdown', onPointerDown);

    window.addEventListener('load', () => {
      tryPlayMusic();
      confetti({ particleCount: 80, spread: 80, origin: { y: 0.6 } });
    });

    /* =========================================================================
       8. ANIMATION LOOP & RESIZE
       ========================================================================= */
    function animate() {
      requestAnimationFrame(animate);

      controls.update();

      const isMobile = window.innerWidth < 600;
      const spreadX = isMobile ? 12 : 24;
      const spreadZ = isMobile ? 12 : 20;

      for (let i = 0; i < fallingItems.length; i++) {
        const item = fallingItems[i];
        item.mesh.position.y -= item.baseSpeed;

        if (item.rotSpeedX !== undefined) {
          item.mesh.rotation.x += item.rotSpeedX;
          item.mesh.rotation.y += item.rotSpeedY;
          item.mesh.rotation.z += item.rotSpeedZ;
          if (Math.abs(item.rotSpeedY) > 0.04) item.rotSpeedY *= 0.98;
        }

        // Tái sinh ở đỉnh khi rơi qua đáy
        if (item.mesh.position.y < item.resetY) {
          item.mesh.position.y = item.initialY + Math.random() * 6;
          item.mesh.position.x = (Math.random() - 0.5) * spreadX;
          item.mesh.position.z = (Math.random() - 0.5) * spreadZ;

          if (item.type === 'pill') {
            const nextWish = getNextWish();
            item.wish = nextWish;
            const newTex = getPillTexture(nextWish);
            item.mesh.material.map = newTex;
            item.mesh.material.needsUpdate = true;
          }
        }
      }

      particles.rotation.y += 0.0008;

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      width = window.innerWidth;
      height = window.innerHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    });
  </script>
</body>
